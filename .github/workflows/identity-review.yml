name: Identity visual review

on:
  push:
    paths:
      - 'dist/app.js'
      - 'dist/style.css'
      - 'dist/portraits/**'
      - 'dist/identity-*.png'
      - 'scripts/identity-review.cjs'
      - '.github/workflows/identity-review.yml'
  pull_request:
    paths:
      - 'dist/app.js'
      - 'dist/style.css'
      - 'dist/portraits/**'
      - 'dist/identity-*.png'
      - 'scripts/identity-review.cjs'
      - '.github/workflows/identity-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-matrix:
    name: Review playable identity matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Review race, class, subclass and gender coverage
        run: node scripts/identity-review.cjs

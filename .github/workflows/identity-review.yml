name: Release preflight review

on:
  push:
    paths:
      - 'dist/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/identity-review.yml'
  pull_request:
    paths:
      - 'dist/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/identity-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-preflight:
    name: Test playable identities and prologue before release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run complete preflight
        run: node scripts/release-preflight.cjs
